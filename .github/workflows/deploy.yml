name: Deploy MUN site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          SITE_PATH="$HOME/htdocs/mun.iiti.ac.in"
          cd "$SITE_PATH"

          echo "== Recording current commit (for rollback if needed) =="
          PREV_COMMIT=$(git rev-parse HEAD)
          echo "$PREV_COMMIT" > /tmp/mun_prev_commit.txt

          echo "== Pulling latest code =="
          git fetch origin main
          git reset --hard origin/main

          echo "== Installing dependencies =="
          npm ci

          echo "== Optimizing images (JPG/PNG -> WebP) =="
          npm run optimize:images

          echo "== Building (vite build -> dist/) =="
          npm run build

          echo "== Deploy steps finished =="
          ls -la dist/

      - name: Rollback on failure
        if: failure()
        run: |
          SITE_PATH="$HOME/htdocs/mun.iiti.ac.in"
          cd "$SITE_PATH"
          if [ -f /tmp/mun_prev_commit.txt ]; then
            PREV_COMMIT=$(cat /tmp/mun_prev_commit.txt)
            echo "Rolling back to $PREV_COMMIT"
            git reset --hard "$PREV_COMMIT"
            npm ci
            npm run build
            echo "Rollback complete, app restarted"
          else
            echo "No previous commit recorded, skipping rollback"
          fi